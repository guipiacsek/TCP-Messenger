<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007aff">
<title>TCP Messenger</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  :root { --bg: #fff; --soft: #f2f2f7; --line: #eee; --text: #1c1c1e; --muted: #8e8e93; --in: #e9e9eb; --pm-in: #fff1d6;
          --blue: #007aff; --purple: #af52de; --green: #34c759; --red: #ff3b30; --amber: #ff9f0a; --shadow: 0 6px 24px rgba(0,0,0,.15); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --soft: #2c2c2e; --line: #38383a; --text: #f2f2f7; --in: #3a3a3c; --pm-in: #4a3b1f; --shadow: 0 6px 24px rgba(0,0,0,.5); }
  }
  html, body { height: 100%; }
  body { height: 100dvh; font: 15px/1.4 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  button { font-family: inherit; }
  header { padding: 14px 16px 10px; padding-top: max(14px, env(safe-area-inset-top)); text-align: center; border-bottom: 1px solid var(--line); background: var(--soft); position: relative; }
  header b { font-size: 17px; display: block; } header small { color: var(--green); font-size: 12px; }
  #inviteBtn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); border: 0; background: none; font-size: 22px; cursor: pointer; display: none; padding: 6px; }
  #banner { display: none; padding: 6px 12px; text-align: center; font-size: 13px; color: #fff; background: var(--amber); }
  #banner.show { display: block; } #banner.offline { background: var(--red); }
  .chips { display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; border-bottom: 1px solid var(--line); flex: none; }
  .chip { padding: 6px 12px; border-radius: 99px; background: var(--soft); cursor: pointer; white-space: nowrap; font-size: 14px; border: 0; color: inherit; display: flex; gap: 6px; align-items: center; }
  .chip.on { background: var(--blue); color: #fff; }
  .chip.gone { opacity: .5; }
  .badge { background: var(--red); color: #fff; border-radius: 99px; font-size: 11px; min-width: 18px; padding: 1px 5px; font-weight: 600; }
  #log { flex: 1; overflow-y: auto; padding: 12px; position: relative; }
  .thread { display: none; flex-direction: column; gap: 4px; } .thread.on { display: flex; }
  .b { max-width: 78%; padding: 8px 13px; border-radius: 18px; overflow-wrap: anywhere; white-space: pre-wrap; cursor: pointer; transition: box-shadow .3s; }
  .in { background: var(--in); align-self: flex-start; border-bottom-left-radius: 4px; }
  .out { background: var(--blue); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .pm.in { background: var(--pm-in); } .pm.out { background: var(--purple); }
  .b.flash { box-shadow: 0 0 0 3px var(--amber); }
  .quote { display: block; border-left: 3px solid currentColor; padding: 2px 8px; margin-bottom: 4px; font-size: 13px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .name { font-size: 11px; color: var(--muted); margin: 8px 0 0 12px; } .name.r { align-self: flex-end; margin: 8px 12px 0 0; }
  .tick { font-size: 11px; color: var(--muted); align-self: flex-end; margin: 0 12px 0 0; cursor: default; }
  .tick.fail { color: var(--red); }
  .reacts { display: flex; gap: 4px; flex-wrap: wrap; margin: -2px 6px 2px; }
  .reacts:empty { display: none; }
  .reacts.r { align-self: flex-end; } .reacts.l { align-self: flex-start; }
  .react { border: 1px solid var(--line); background: var(--bg); color: inherit; border-radius: 99px; padding: 1px 7px; font-size: 13px; cursor: pointer; }
  .react.mine { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 15%, var(--bg)); }
  .actions { display: flex; gap: 2px; padding: 4px; border-radius: 99px; background: var(--bg); box-shadow: var(--shadow); align-self: flex-start; margin: 2px 6px; }
  .actions.r { align-self: flex-end; }
  .actions button { border: 0; background: none; font-size: 20px; padding: 4px 6px; border-radius: 99px; cursor: pointer; color: inherit; }
  .actions button:hover { background: var(--soft); }
  .actions .reply { font-size: 13px; font-weight: 600; padding: 4px 10px; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); margin: 8px 0; text-align: center; }
  .sys.err { color: var(--red); }
  .file { display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
  .file .fname { font-weight: 600; } .file small { opacity: .75; }
  .file img { max-width: 100%; max-height: 240px; border-radius: 10px; }
  .bar { height: 4px; border-radius: 2px; background: rgba(128,128,128,.3); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: currentColor; transition: width .1s; }
  .file button, .file a { align-self: flex-start; border: 0; border-radius: 99px; padding: 4px 10px; font-size: 12px; cursor: pointer; background: rgba(128,128,128,.2); color: inherit; text-decoration: none; }
  #typingBar { height: 18px; padding: 0 16px; font-size: 12px; color: var(--muted); font-style: italic; flex: none; }
  #replyBar { display: none; align-items: center; gap: 8px; padding: 6px 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  #replyBar.show { display: flex; } #replyBar span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #replyBar b { color: var(--text); }
  #replyBar button { border: 0; background: none; color: inherit; font-size: 18px; cursor: pointer; }
  #f { display: flex; gap: 8px; padding: 6px 12px 14px; padding-bottom: max(14px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); flex: none; align-items: center; }
  input { flex: 1; border: 1px solid var(--line); background: var(--bg); color: inherit; border-radius: 99px; padding: 9px 14px; font: inherit; outline-color: var(--blue); min-width: 0; }
  .send, .attach { width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer; flex: none; font-size: 18px; }
  .send { background: var(--blue); color: #fff; } .attach { background: var(--soft); color: inherit; }
  .send:disabled, .attach:disabled { opacity: .4; cursor: default; }
  #drop { display: none; position: fixed; inset: 0; z-index: 2; background: color-mix(in srgb, var(--blue) 25%, transparent); border: 3px dashed var(--blue); place-items: center; font-size: 20px; font-weight: 600; color: var(--text); pointer-events: none; }
  #drop.show { display: grid; }
  #invite { margin: auto; border: 0; border-radius: 16px; padding: 22px; max-width: 320px; text-align: center; background: var(--bg); color: var(--text); box-shadow: var(--shadow); }
  #invite::backdrop { background: rgba(0,0,0,.4); }
  #invite img { width: 240px; height: 240px; background: #fff; padding: 10px; border-radius: 10px; margin: 12px 0; }
  #invite p { font-size: 13px; color: var(--muted); margin-top: 6px; } #invite code { font-size: 12px; word-break: break-all; }
  #invite button { margin-top: 14px; padding: 8px 20px; border-radius: 99px; border: 0; background: var(--blue); color: #fff; cursor: pointer; }
  /* join screen */
  #join { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; padding: 32px; gap: 14px; text-align: center; z-index: 1; border: 0; }
  #join h1 { font-size: 26px; } #join p { color: var(--muted); font-size: 14px; }
  #join > * { width: 100%; max-width: 320px; align-self: center; }
  #join input { flex: none; text-align: center; padding: 12px; }
  #join button { padding: 12px; border-radius: 99px; border: 0; background: var(--blue); color: #fff; font: 600 15px inherit; cursor: pointer; }
  #joinErr { color: var(--red); font-size: 13px; min-height: 18px; }
  @media (max-width: 600px) { input { font-size: 16px; } .b { max-width: 85%; } }  /* 16px stops iOS zooming on focus */
</style></head><body>
<form id="join">
  <h1>TCP Messenger</h1>
  <p id="joinInfo">Pick a username to join</p>
  <input id="nameIn" placeholder="username" autocomplete="off" autofocus maxlength="20" aria-label="Username">
  <input id="passIn" type="password" placeholder="room password" aria-label="Room password">
  <input id="serverIn" placeholder="searching for a server…" autocomplete="off" aria-label="Server address">
  <p id="serverInfo"></p>
  <button>Join</button>
  <div id="joinErr" role="alert"></div>
</form>

<header><b>TCP Messenger</b><small id="statusEl"></small>
  <button id="inviteBtn" aria-label="Invite a phone" title="Invite a phone">📱</button></header>
<div id="banner" role="status"></div>
<div class="chips" id="chips" role="tablist" aria-label="Conversations"></div>
<div id="log" aria-live="polite"></div>
<div id="typingBar" aria-live="polite"></div>
<div id="replyBar"><span id="replyText"></span><button id="replyCancel" aria-label="Cancel reply">✕</button></div>
<form id="f">
  <button type="button" class="attach" id="attachBtn" aria-label="Send a file" title="Send a file (or drag one in)">📎</button>
  <input type="file" id="fileIn" hidden>
  <input id="t" placeholder="Message everyone" autocomplete="off" aria-label="Message">
  <button class="send" id="sendBtn" aria-label="Send">↑</button>
</form>
<div id="drop">Drop to send</div>
<dialog id="invite">
  <b>Join from a phone</b>
  <img id="qr" alt="QR code to join this chat">
  <p>Scan with a phone on this Wi-Fi. Anyone who scans it can join.</p>
  <p>The first time, the phone warns that the connection isn't private: the server made its own certificate. Tap through to continue.</p>
  <p><code id="inviteUrl"></code></p>
  <button onclick="invite.close()">Done</button>
</dialog>

<script>
  let me = "", to = "", users = [], encrypted = false, connected = true, minPassword = 8, isWeb = false;
  let replyTo = null, openActions = null;
  const threads = new Map();   // "" = Everyone, else username -> {el, unread, typing}
  const pending = new Map();   // my message/file id -> {tick, to, acks:Set, latency}
  const files = new Map();     // file id -> {bar, box, size}
  const msgs = new Map();      // message id -> {el, key, from, text, reactions: Map(emoji -> Set(user)), reactEl}
  const EMOJI = ["👍", "❤️", "😂", "😮", "😢"];
  const MAX_FILE = 10 * 1024 * 1024;
  const api = () => window.pywebview.api;

  // --- threads -----------------------------------------------------------------------
  function thread(key) {
    if (!threads.has(key)) {
      const el = document.createElement("div"); el.className = "thread"; log.append(el);
      threads.set(key, {el, unread: 0, typing: null});
    }
    return threads.get(key);
  }
  function add(key, cls, text) {
    const d = document.createElement("div"); d.className = cls;
    if (text !== undefined) d.textContent = text;
    thread(key).el.append(d);
    if (key === to) log.scrollTop = log.scrollHeight;
    return d;
  }
  function bubble(key, who, text, cls, quote) {
    add(key, "name" + (cls.includes("out") ? " r" : ""), who);
    const b = add(key, "b " + cls);
    if (quote) {
      const q = document.createElement("span"); q.className = "quote";
      q.textContent = `${quote.from}: ${quote.text}`;
      q.onclick = e => { e.stopPropagation(); jumpTo(quote.id); };
      b.append(q);
    }
    if (text !== undefined) b.append(text);
    return b;
  }
  function unread(key, title, body) {
    const away = !document.hasFocus();
    if (key !== to || away) { thread(key).unread++; renderChips(); updateBadge(); }
    if (away) api().notify(title, body);
  }
  function updateBadge() {
    let n = 0; threads.forEach(t => n += t.unread);
    api().set_badge(n);
    document.title = (n ? `(${n}) ` : "") + "TCP Messenger";
  }
  function select(key) {
    to = key; const t = thread(key); t.unread = 0;
    threads.forEach((th, k) => th.el.classList.toggle("on", k === key));
    closeActions(); renderChips(); updateBadge(); renderTyping();
    log.scrollTop = log.scrollHeight;
  }
  function renderChips() {
    const keys = ["", ...users.filter(u => u !== me)];
    threads.forEach((_, k) => { if (!keys.includes(k)) keys.push(k); });  // keep threads of people who left
    chips.replaceChildren(...keys.map(k => {
      const c = document.createElement("button"), n = threads.get(k)?.unread || 0;
      c.className = "chip" + (k === to ? " on" : "") + (k && !users.includes(k) ? " gone" : "");
      c.role = "tab"; c.setAttribute("aria-selected", k === to);
      c.append(k ? "🔒 " + k : "Everyone");
      if (n) { const b = document.createElement("span"); b.className = "badge"; b.textContent = n; c.append(b); }
      c.onclick = () => select(k);
      return c;
    }));
    t.placeholder = "Message " + (to || "everyone") + (to && !users.includes(to) ? " (offline)" : "");
    statusEl.textContent = `● ${users.length} online` + (encrypted ? " · 🔒 encrypted" : " · ⚠ not encrypted");
  }

  // --- replies & reactions -----------------------------------------------------------
  // every message bubble is registered so it can be replied to, reacted to and jumped to
  function register(id, el, key, from, text, mine) {
    if (!id) return;
    const reactEl = document.createElement("div"); reactEl.className = "reacts " + (mine ? "r" : "l");
    el.after(reactEl);
    msgs.set(id, {el, key, from, text, mine, reactions: new Map(), reactEl});
    el.onclick = () => toggleActions(id);
  }
  function toggleActions(id) {
    const m = msgs.get(id), wasOpen = openActions?.id === id;
    closeActions();
    if (wasOpen || !connected) return;
    const bar = document.createElement("div"); bar.className = "actions" + (m.mine ? " r" : "");
    const rep = document.createElement("button"); rep.className = "reply"; rep.textContent = "↩ Reply";
    rep.onclick = () => { startReply(id); closeActions(); };
    bar.append(rep, ...EMOJI.map(e => {
      const b = document.createElement("button"); b.textContent = e; b.setAttribute("aria-label", "React " + e);
      b.onclick = () => { react(id, e); closeActions(); };
      return b;
    }));
    m.reactEl.after(bar);
    openActions = {id, bar};
  }
  function closeActions() { openActions?.bar.remove(); openActions = null; }
  function startReply(id) {
    const m = msgs.get(id);
    replyTo = {id, from: m.mine ? me : m.from, text: m.text};
    replyText.replaceChildren("Replying to ", Object.assign(document.createElement("b"), {textContent: replyTo.from}), `: ${m.text}`);
    replyBar.classList.add("show"); t.focus();
  }
  function cancelReply() { replyTo = null; replyBar.classList.remove("show"); }
  replyCancel.onclick = cancelReply;
  function jumpTo(id) {
    const m = msgs.get(id); if (!m) return;
    if (m.key !== to) select(m.key);
    m.el.scrollIntoView({block: "center", behavior: "smooth"});
    m.el.classList.add("flash"); setTimeout(() => m.el.classList.remove("flash"), 1200);
  }
  function react(id, emoji) {
    const m = msgs.get(id);
    toggleReaction(id, emoji, me);
    api().react(id, emoji, m.key || null);  // a private thread's key is the other person
  }
  function toggleReaction(id, emoji, who) {
    const m = msgs.get(id); if (!m || !EMOJI.includes(emoji)) return;
    const set = m.reactions.get(emoji) || new Set();
    set.has(who) ? set.delete(who) : set.add(who);
    set.size ? m.reactions.set(emoji, set) : m.reactions.delete(emoji);
    m.reactEl.replaceChildren(...[...m.reactions].map(([e, s]) => {
      const b = document.createElement("button");
      b.className = "react" + (s.has(me) ? " mine" : ""); b.textContent = `${e} ${s.size}`;
      b.title = [...s].join(", "); b.onclick = () => react(id, e);
      return b;
    }));
  }

  // --- typing ------------------------------------------------------------------------
  function renderTyping() {
    const who = thread(to).typing;
    typingBar.textContent = who ? `${who} is typing…` : "";
  }
  function showTyping(key, who) {
    const th = thread(key); th.typing = who; renderTyping();
    clearTimeout(th.typingTimer); th.typingTimer = setTimeout(() => { th.typing = null; renderTyping(); }, 4000);
  }
  function clearTyping(key) { const th = thread(key); th.typing = null; renderTyping(); }
  let lastTyping = 0;
  t.addEventListener("input", () => {
    if (!connected || !t.value || Date.now() - lastTyping < 3000) return;
    lastTyping = Date.now(); api().typing(to || null);
  });

  // --- ticks -------------------------------------------------------------------------
  function track(key, id) {
    const tick = add(key, "tick", id ? "✓" : "⚠ not sent");
    if (!id) { tick.classList.add("fail"); return; }
    tick.title = "sent";
    pending.set(id, {tick, to: key, acks: new Set()});
  }
  function onAck(msg) {
    const p = pending.get(msg.id); if (!p) return;
    p.acks.add(msg.from);
    if (p.latency === undefined && msg.latency_ms !== undefined) p.latency = msg.latency_ms;
    p.tick.textContent = "✓✓";
    const lat = p.latency !== undefined ? ` · ${p.latency.toFixed(1)} ms` : "";
    p.tick.title = (p.to ? `delivered to ${p.to}` : `delivered to ${p.acks.size} (${[...p.acks].join(", ")})`) + lat;
  }

  // --- files -------------------------------------------------------------------------
  const kb = n => n < 1024 * 1024 ? `${Math.max(1, Math.round(n / 1024))} KB` : `${(n / 1024 / 1024).toFixed(1)} MB`;
  function fileBubble(key, who, cls, id, name, size, from, mine) {
    const b = bubble(key, who, undefined, "file " + cls);
    const fname = document.createElement("span"); fname.className = "fname"; fname.textContent = "📄 " + name;
    const info = document.createElement("small"); info.textContent = kb(size);
    const bar = document.createElement("div"); bar.className = "bar"; bar.append(document.createElement("i"));
    b.append(fname, info, bar);
    files.set(id, {box: b, bar, info, size});
    register(id, b, key, from, "📄 " + name, mine);
    if (early.has(id)) fileProgress(early.get(id));
    return b;
  }
  const early = new Map();  // progress that arrived before the send call returned and the bubble existed
  function fileProgress(msg) {
    const f = files.get(msg.id); if (!f) { early.set(msg.id, msg); return; }
    f.bar.firstChild.style.width = (100 * msg.done / Math.max(1, msg.size)) + "%";
    if (msg.done >= msg.size) f.bar.remove();
  }
  function addImage(id, src) {
    const f = files.get(id), img = document.createElement("img");
    img.src = src; img.alt = ""; f.box.insertBefore(img, f.box.firstChild);
  }
  function fileDone(msg) {
    const f = files.get(msg.id); if (!f) return;
    f.bar.remove();
    if (msg.image) addImage(msg.id, msg.image);
    if (msg.url) {  // browser: the server keeps the file, we download it from there
      const a = document.createElement("a"); a.href = msg.url; a.download = msg.name; a.textContent = "Download";
      a.onclick = e => e.stopPropagation(); f.box.append(a);
    } else if (msg.path) {
      const btn = document.createElement("button"); btn.textContent = "Show in Finder";
      btn.onclick = e => { e.stopPropagation(); api().reveal(msg.path); }; f.box.append(btn);
    }
  }
  function fileFail(id, text) {
    const f = files.get(id); if (!f) return;
    f.bar.remove(); f.info.textContent = "⚠ " + text;
  }
  async function sendFile(file) {
    if (!connected || !file) return;
    const key = to;
    if (file.size > MAX_FILE) { add(key, "sys err", `${file.name} is ${kb(file.size)}; the limit is 10 MB`); return; }
    const data = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1] || ""); r.readAsDataURL(file); });
    const r = await api().send_file_data(file.name, data, key || null);
    if (!r) { add(key, "sys err", "Not connected; file not sent"); return; }
    if (r.error) { add(key, "sys err", r.error); return; }
    fileBubble(key, key ? `you → ${key} · private` : "you", "out" + (key ? " pm" : ""), r.id, r.name, r.size, me, true);
    if (r.image) addImage(r.id, r.image);
    track(key, r.id);
  }
  attachBtn.onclick = () => fileIn.click();
  fileIn.onchange = () => { sendFile(fileIn.files[0]); fileIn.value = ""; };
  let dragDepth = 0;
  const dragging = e => me && e.dataTransfer && [...e.dataTransfer.types].includes("Files");
  document.addEventListener("dragenter", e => { if (!dragging(e)) return; e.preventDefault(); dragDepth++;
    drop.textContent = `Drop to send to ${to || "everyone"}`; drop.classList.add("show"); });
  document.addEventListener("dragover", e => { if (dragging(e)) e.preventDefault(); });
  document.addEventListener("dragleave", e => { if (dragging(e) && --dragDepth <= 0) { dragDepth = 0; drop.classList.remove("show"); } });
  document.addEventListener("drop", e => {
    if (!dragging(e)) return;
    e.preventDefault(); dragDepth = 0; drop.classList.remove("show");
    [...e.dataTransfer.files].forEach(sendFile);
  });

  // --- invite a phone (desktop only) -------------------------------------------------
  inviteBtn.onclick = async () => {
    const r = await api().invite();
    if (!r) { add(to, "sys err", "This server doesn't have phone access turned on."); return; }
    qr.src = r.qr; inviteUrl.textContent = r.url.split("#")[0];
    invite.showModal();
  };

  // --- incoming ----------------------------------------------------------------------
  // called from Python (gui.py, or web.py through web.js) for every event ChatClient produces
  window.onMessage = msg => {
    const priv = msg.to && msg.to === me, key = priv ? msg.from : "";
    switch (msg.type) {
      case "msg": clearTyping(""); register(msg.id, bubble("", msg.from, msg.text, "in", msg.reply_to), "", msg.from, msg.text);
        unread("", msg.from, msg.text); break;
      case "pm": clearTyping(msg.from); register(msg.id, bubble(msg.from, msg.from, msg.text, "in pm", msg.reply_to), msg.from, msg.from, msg.text);
        unread(msg.from, `${msg.from} (private)`, msg.text); break;
      case "react": toggleReaction(msg.id, msg.emoji, msg.from); break;
      case "typing": showTyping(msg.to ? msg.from : "", msg.from); break;
      case "ack": onAck(msg); break;
      case "list": users = msg.users; renderChips(); break;
      case "sys": add("", "sys", msg.text); api().list_users(); break;  // join/leave: refresh chips
      case "file_start":
        fileBubble(key, msg.from + (priv ? " · private" : ""), "in" + (priv ? " pm" : ""), msg.id, msg.name, msg.size, msg.from, false); break;
      case "file_progress": fileProgress(msg); break;
      case "file_saved": fileDone(msg); unread(msg.to ? msg.from : "", msg.from, "sent you " + msg.name); break;
      case "file_failed": fileFail(msg.id, msg.text); break;
      case "status": setStatus(msg.state); break;
      case "error": add(to, "sys err", msg.text); break;
    }
  };
  function setStatus(state) {
    connected = state === "connected";
    banner.className = state === "connected" ? "" : "show" + (state === "offline" ? " offline" : "");
    banner.textContent = state === "offline" ? (isWeb ? "Disconnected. Reload the page to rejoin." : "Disconnected. Restart the app to rejoin.")
                                             : "Connection lost. Reconnecting…";
    t.disabled = sendBtn.disabled = attachBtn.disabled = state === "offline";
    if (state === "connected") { add("", "sys", "Reconnected"); api().list_users(); }
    if (state !== "connected") { statusEl.textContent = state === "offline" ? "● offline" : "● reconnecting"; closeActions(); }
    statusEl.style.color = {connected: "", offline: "var(--red)"}[state] ?? "var(--amber)";
  }
  window.addEventListener("focus", () => { if (me) { thread(to).unread = 0; renderChips(); updateBadge(); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closeActions(); cancelReply(); } });

  // --- join & send -------------------------------------------------------------------
  // pywebview (or web.js in a browser) provides the API after load and fires this event
  window.addEventListener("pywebviewready", async () => {
    const s = await api().setup();
    encrypted = s.encrypted; minPassword = s.min_password; isWeb = !!s.web;
    if (!encrypted) passIn.remove(); else passIn.placeholder = `room password (min ${minPassword})`;
    if (isWeb) { serverIn.value = s.server; serverIn.hidden = true; return; }
    inviteBtn.style.display = "block";
    if (s.server) { serverIn.value = s.server; return; }
    serverInfo.textContent = "Searching the network…";
    const found = await api().discover();
    if (serverIn.value) return;  // user typed one meanwhile
    serverIn.value = found || "";
    serverIn.placeholder = "server IP, e.g. 192.168.1.20";
    serverInfo.textContent = found ? "Found a server on the network" : "No server found. Type the server's IP address";
  });

  join.onsubmit = async e => {
    e.preventDefault();
    const name = nameIn.value.trim();
    if (!name || /\s/.test(name)) { joinErr.textContent = "Username can't be empty or contain spaces"; return; }
    if (encrypted && passIn.value.length < minPassword) { joinErr.textContent = `Password must be at least ${minPassword} characters`; return; }
    if (!serverIn.value.trim()) { joinErr.textContent = "Enter the server address (e.g. 192.168.1.20)"; return; }
    joinErr.textContent = "Connecting…";
    const r = await api().join(name, encrypted ? passIn.value : "", serverIn.value);
    if (!r || !r.ok) { joinErr.textContent = r ? r.error : "Connection lost. Reload to retry."; return; }
    me = r.name; encrypted = r.encrypted;
    join.remove(); select(""); add("", "sys", isWeb ? `Connected as ${me}` : `Connected to ${r.server} as ${me}`);
  };

  f.onsubmit = async e => {
    e.preventDefault();
    const text = t.value.trim(), key = to, quote = replyTo; if (!text || !connected) return;
    t.value = ""; lastTyping = 0; cancelReply();
    const b = bubble(key, key ? `you → ${key} · private` : "you", text, "out" + (key ? " pm" : ""), quote);
    const id = await (key ? api().private(key, text, quote) : api().broadcast(text, quote));
    register(id, b, key, me, text, true);
    track(key, id);
  };
</script>
</body></html>
